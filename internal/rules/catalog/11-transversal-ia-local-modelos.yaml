# Emenda V4 §47 (D-10): inferência pela Gemini API.
- id: TRV-IA-011
  origem: "§§47.1, 47.5"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [ARQUITETURA, UI]
  enunciado: "Inferência pela Gemini API (SDK oficial google.golang.org/genai, chave do usuário); nenhum modelo fixo no código: o usuário lista os modelos de texto da chave, testa e escolhe um; um modelo por tarefa; sem fallback local"
  modulo: "inference.MotorGemini; app.IAService"
  enforced_by: [inference.NovoMotorGemini, inference.ListarModelos]
  falha: "Sem chave → IA-001; modelo indisponível → IA-004"
  testes: ["T27", "IA-MOD-01"]
  versao: 1

- id: TRV-IA-012
  origem: "§§47.6, 38.4"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Resposta só vale se íntegra (fim normal com conteúdo); cortada, bloqueada ou vazia nunca vira resultado; falhas da API viram mensagem clara e parada recuperável, sem sucesso simulado"
  modulo: "inference.MotorGemini"
  enforced_by: [inference.MotorGemini]
  falha: "IA-005…010 conforme a causa"
  testes: ["T15", "IA-RESP-01"]
  versao: 1

- id: TRV-IA-013
  origem: "§§47.2, 38"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [ARQUITETURA]
  enunciado: "Nenhum modelo de linguagem roda no computador: sem requisitos de GPU, RAM ou contexto por memória para a IA; a janela de trabalho mantém o fatiamento (contexto maior não substitui recuperação estruturada)"
  modulo: "inference"
  testes: ["T14", "T16"]
  versao: 1

- id: TRV-IA-014
  origem: "§48.1"
  fluxo: TRV
  rotulo: [APROVADO]
