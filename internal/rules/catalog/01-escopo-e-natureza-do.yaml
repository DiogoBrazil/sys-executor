- id: TRV-ESC-001
  origem: "§§1, 21.2, 28.3"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [POLITICA_IA, VALIDADOR]
  enunciado: "Produzir apenas minutas de apoio; nunca decidir, assinar, publicar, homologar, punir, alterar ficha"
  modulo: "nucleo; validate.NoFakeActs"
  etapas: [nucleo]
  instrucao_ia: "Você redige MINUTAS de apoio para revisão humana. NUNCA decida, assine, publique, homologue, aplique punição nem afirme como efetivada alteração de ficha, pontuação ou comportamento."
  testes: ["SEG13-07", "T09"]
  versao: 1

