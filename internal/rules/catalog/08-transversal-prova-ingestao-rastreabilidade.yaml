# 8. Transversal — prova, ingestão, rastreabilidade
# Semeado de docs/planning/MATRIZ_REQUISITOS_V4.md (Fase 3, F3-08).
# O catálogo é a fonte das regras; mudanças seguem REGRAS_IA_ESTRATEGIA.md §5.3.

- id: TRV-ING-001
  origem: "§§2.2, 16.1, 48.4"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [POLITICA_IA, DETERMINISTICA]
  enunciado: "A função de cada peça é a declarada pelo usuário no cadastro (§48.4); a classificação pela função documental (conteúdo + cronologia), não pelo título, é a conferência da declaração e vale para as peças sem declaração (PDF do SEI separado pelo carimbo)"
  modulo: "ingest/segment"
  etapas: [classificacao]
  instrucao_ia: "Classifique a peça pela função que cumpre nos autos (conteúdo e momento do procedimento), não pelo título."
  enforced_by: [segment.DeDeclaracao, segment.VerificarDeclaradas]
  testes: ["A01", "A02", "D1", "D2", "CAD-PEC-02"]
  versao: 2

- id: TRV-ING-002
  origem: "§§16.1, 48.4"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [PERGUNTA]
  enunciado: "Classificação incerta e material → perguntar; conteúdo que contradiz a função declarada no cadastro → perguntar (voltar ao cadastro ou continuar como cadastrado), nunca trocar"
  modulo: "workflow; pipeline (compatibilidade)"
  testes: ["A01-AMB", "CAD-PEC-02"]
  versao: 2

- id: TRV-ING-003
  origem: "§§16.3, 12.1-6"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA, PERGUNTA]
  enunciado: "OCR quando necessário; baixa confiança sinalizada; peça essencial ilegível → pedir versão legível"
  modulo: "ingest/ocr"
  testes: ["A04", "T06"]
  versao: 1

- id: TRV-ING-004
  origem: "§39"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Autos extensos em etapas; texto integral preservado por página e peça; resumos só auxiliares"
  modulo: "ingest/evidence; orchestrator"
  testes: ["T17"]
  versao: 1

- id: TRV-ING-005
  origem: "§39"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA, UI]
  enunciado: "Cobertura de páginas e peças; nada é ignorado silenciosamente"
  modulo: "ingest/evidence.Cobertura"
  testes: ["T17", "ING-COB-01"]
  versao: 1

- id: TRV-ING-007
  origem: "§48.4"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA, UI]
  enunciado: "Cadastro peça por peça (PADS: Memorando com acusado e fatos/dispositivos, defesa prévia ou não apresentada, depoimentos com papel e depoente, alegações finais ou não apresentadas, outros; SR: Portaria com sindicados e ofendidos ou ausência declarada, depoimentos, outros): identificador próprio por peça, um ou vários arquivos com ordem e origem preservadas, cada oitiva uma peça (a mesma pessoa pode ter várias), arquivo repetido apontado, conferência e correção antes de processar; os arquivos são juntados em memória na ordem processual (numeração global de páginas); o cadastro só existe na sessão; os dados do usuário são cruzados com a leitura da peça central e não ampliam as acusações do Memorando nem o objeto da Portaria"
  modulo: "workflow (cadastro); ingest/pdf (Juntador); pipeline (verificar, delimitar); frontend Montagem"
  enforced_by: [workflow.Cadastro, pdf.Juntador, segment.Declarada]
  falha: "Pendência → TAR-006, nada processado; arquivo repetido → ARQ-004; limite → ARQ-005; PDF ilegível → volta ao cadastro, preservado"
  testes: ["CAD-PEC-01", "CAD-PEC-03"]
  versao: 1

- id: TRV-ING-006
  origem: "§39"
  fluxo: TRV
  rotulo: [APROVADO, A_VALIDAR]
  tipo: [ARQUITETURA]
  enunciado: "Busca vetorial temporária dos autos opcional; não obrigatória"
  modulo: "ingest/evidence"
  testes: ["BEN-RAG-01"]
  versao: 1

