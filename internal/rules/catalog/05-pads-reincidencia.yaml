- id: PADS-REI-001
  origem: "§§7.1, 15.5-1"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Somente mesma natureza (L/L, M/M, G/G); a equivalência de comportamento não muda a natureza"
  modulo: "engine.Reincidencia"
  enforced_by: [engine.Reincidencia]
  testes: ["R4", "A21", "C13-REI-01"]
  versao: 1

- id: PADS-REI-002
  origem: "§§7.1, 15.5-2"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Usar a data de término do cumprimento da punição anterior × data do fato atual"
  modulo: "engine.Reincidencia"
  enforced_by: [engine.Reincidencia]
  testes: ["R1", "C13-REI-02"]
  versao: 1

- id: PADS-REI-003
  origem: "§15.5-3"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Término estritamente anterior ao fato; posterior impede"
  modulo: "engine.Reincidencia"
  enforced_by: [engine.Reincidencia]
  testes: ["R2", "A22"]
  versao: 1

