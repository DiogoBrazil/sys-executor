  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [PERGUNTA, DETERMINISTICA]
  enunciado: "Data de término desconhecida → perguntar só se necessário; não fornecida → não reconhecer, com registro explicativo"
  modulo: "workflow; engine"
  enforced_by: [engine.Reincidencia, engine.ProximaPerguntaReincidencia]
