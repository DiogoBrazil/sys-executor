# 4. PADS — conexão e dosimetria
# Semeado de docs/planning/MATRIZ_REQUISITOS_V4.md (Fase 3, F3-08).
# O catálogo é a fonte das regras; mudanças seguem REGRAS_IA_ESTRATEGIA.md §5.3.

- id: PADS-CNX-001
  origem: "§§5.1, 8.7; RDPM 58 VI §1º"
  fluxo: PADS
  rotulo: [APROVADO, INTERPRETACAO]
  interpretacao: I-04
  tipo: [DETERMINISTICA, PERGUNTA]
  enunciado: "Conexas: escolher a principal (maior gravidade demonstrada, confirmada); secundárias como agravante; sem punição autônoma nem dupla contagem"
  modulo: "engine.ConexaoPrincipal"
  enforced_by: [engine.SugerirPrincipal, engine.AplicarConexao]
  testes: ["C13-CNX-01"]
  versao: 1

- id: PADS-CNX-002
  origem: "§5.2"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Não conexas: punição individual por transgressão procedente, com análise própria"
  modulo: "engine.Sancoes"
  enforced_by: [engine.AplicarConexao, pads.Julgamento]
  testes: ["C13-IND-01", "MP-01", "MP-02", "MP-03", "MP-04", "MP-05", "MP-06"]
  versao: 1

- id: PADS-CNX-003
  origem: "§5.3"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [PERGUNTA]
  enunciado: "Explicar conexão com base nos autos; perguntar se necessário; não repetir perguntas"
  modulo: "workflow"
  testes: ["PRG-01"]
  versao: 1

- id: PADS-DOS-001
  origem: "§6.1; RDPM 36"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [VALIDADOR, POLITICA_IA]
  enunciado: "Havendo punição, examinar os sete fatores I–VII individualmente, indicando ausência de elementos quando for o caso"
  modulo: "validate.RequiredParts"
  enforced_by: [engine.VerificarArt36]
  etapas: [redacao]
  condicao: [tem_punicao]
  instrucao_ia: "Havendo punição, examine individualmente os sete fatores do art. 36 (I a VII); sem elemento nos autos, escreva expressamente que há ausência de elementos."
  testes: ["DOS-36-01"]
  versao: 1

- id: PADS-DOS-002
  origem: "§6.2; RDPM 37"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [POLITICA_IA]
  enunciado: "Causas de justificação examinadas com fundamentação"
  modulo: "pads/circunstancias"
  enforced_by: [engine.Dosimetria]
  etapas: [analise]
  instrucao_ia: "Examine as causas de justificação do art. 37 com fundamento nos autos; NUNCA reconheça uma causa sem elemento concreto."
  testes: ["DOS-37-01"]
  versao: 1

- id: PADS-DOS-003
  origem: "§6.2; RDPM 38, 39"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [POLITICA_IA, PERGUNTA]
  enunciado: "Atenuantes e agravantes com fundamentação específica, sem presunção"
  modulo: "pads/circunstancias"
  enforced_by: [engine.Dosimetria]
  etapas: [analise]
  instrucao_ia: "Sugira atenuantes e agravantes (arts. 38 e 39) só com fundamento específico nos autos e evidência citada; NUNCA presuma circunstância."
  testes: ["DOS-38-01"]
  versao: 1

- id: PADS-DOS-004
  origem: "§§6.2, 9, 15.6"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA]
  enunciado: "Comportamento anterior: ÓT/EXC → atenuante 38 I; INS → agravante 39 I; BOM → nenhuma"
  modulo: "engine.CircunstanciaComportamento"
  enforced_by: [engine.Dosimetria]
  testes: ["DOS-CMP-01", "DOS-CMP-02", "DOS-CMP-03"]
  versao: 1

