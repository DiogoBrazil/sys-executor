- id: SR-SOL-009
  origem: "§25.5"
  fluxo: SR
  rotulo: [APROVADO]
  tipo: [VALIDADOR]
  enunciado: "Exemplos S1–S5 são ilustrativos; nunca preencher marcadores fictícios"
  modulo: "validate.NoPlaceholderLeak"
  testes: ["S1", "S2", "S3", "S4", "S5"]
  versao: 1

- id: SR-LAC-001
  origem: "§26.1"
  fluxo: SR
  rotulo: [APROVADO]
  tipo: [PERGUNTA, POLITICA_IA]
  enunciado: "Lacuna impeditiva → alertar + diligências concretas; o usuário decide prosseguir; conclusão inconclusiva qualificada"
  modulo: "workflow"
  etapas: [analise]
  instrucao_ia: "Lacuna que impede concluir: aponte-a e sugira diligências concretas; NUNCA conclua como se a prova estivesse completa."
  testes: ["SR13", "SR33"]
  versao: 1

- id: SR-NAT-001
  origem: "§21.1"
  fluxo: SR
  rotulo: [APROVADO]
  tipo: [VALIDADOR]
  enunciado: "SR sem punição, dosimetria, reincidência, comportamento ou pontos"
