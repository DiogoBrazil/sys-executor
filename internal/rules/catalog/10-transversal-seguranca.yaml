# Emenda V4 §47 (D-10): inferência pela Gemini API.
- id: TRV-SEG-009
  origem: "§47.4"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA]
  enunciado: "Chave da Gemini API cifrada com DPAPI (conta do usuário); nunca na interface, em eventos, preferências, erros ou logs; validada sem gerar texto; substituível e removível"
  modulo: "credencial; app.IAService"
  enforced_by: [credencial.LojaArquivo, app.VisaoIA]
  falha: "Falha da DPAPI → IA-012; chave recusada não é guardada"
  testes: ["SEG-KEY-01"]
  versao: 1

- id: TRV-SEG-010
  origem: "§§47.3, 48.1"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA, UI]
  enunciado: "Confirmação de envio à IA em cada tarefa, antes da primeira etapa de IA (serviço, modelo, peças, estimativa de tokens, resumo da pseudonimização); vale para um provedor e um modelo: se qualquer um mudar, o motor anterior é fechado e nada vai ao novo alvo antes de nova confirmação; sem autorização nada é enviado"
  modulo: "pipeline (envio_ia)"
  enforced_by: [pipeline.PerguntaEnvioIA, inference.Alvo]
  falha: "Recusa → IA-011, parada recuperável; nova tentativa pergunta de novo"
  testes: ["SEG-ENV-01", "SEG-ENV-02"]
  versao: 2

- id: TRV-SEG-011
  origem: "§47.3"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA]
  enunciado: "Pseudonimização de dados pessoais antes do envio (nomes, CPF, RG, matrícula, telefone, e-mail, CEP, endereço, nascimento) e restauração exata na resposta; grafias que só diferem em caixa, acento ou quebra de linha (inclusive escapada em JSON) são ocultadas; nome de uma só palavra só com inicial maiúscula; melhor esforço, não anonimização; datas dos fatos, números SEI e links não são trocados"
  modulo: "pseudonimo"
  enforced_by: [pseudonimo.Envolver, pseudonimo.Mapa]
  falha: "Marcador alterado ou deformado (qualquer tipo, qualquer caixa entre colchetes) → correção pedida; persistindo, IA-010"
  testes: ["SEG-PSEUDO-01"]
  versao: 2

- id: TRV-SEG-012
  origem: "§§47.3, 48.7"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA]
  enunciado: "Destinos de rede fixos e de origem única, sem redirecionamento nem cookies: Gemini API só em generativelanguage.googleapis.com; ChatGPT só em api.openai.com (inferência e modelos) e auth.openai.com (login); nunca endpoints privados do ChatGPT; store=false, sem ferramentas, sem Files API nem armazenamento de contexto no provedor"
  modulo: "inference.MotorGemini; inference.MotorChatGPT; chatgpt"
  enforced_by: [inference.TransporteRestrito, inference.HostGemini, inference.OrigemAPIOpenAI, chatgpt.EmissorOpenAI]
  testes: ["SEG-NET-01"]
  versao: 2

- id: TRV-SEG-013
  origem: "§48.6"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA, UI]
  enunciado: "Barreira obrigatória antes de cada envio à IA: dado pessoal conhecido que reste no pedido (instruções, dados, histórico, schema) ou nos bytes da requisição bloqueia o envio sem opção de ignorar; possível nome sem âncora não decidido pára para revisão item a item (na autorização e no meio da etapa), sem confirmação genérica; a tabela de correspondência nunca sai do computador"
  modulo: "pseudonimo (camada 1 e Inspecionar); inference.TransporteRestrito (camada 2); pipeline (revisão)"
  enforced_by: [pseudonimo.ErrVazamento, pseudonimo.ErrRevisao, inference.ErrInspecao]
  falha: "Resíduo → IA-014, nada enviado; revisão recusada → IA-011, parada recuperável"
  testes: ["SEG-BAR-01"]
  versao: 1

- id: TRV-SEG-014
  origem: "§48.3"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA]
  enunciado: "Credencial do ChatGPT (registro, identidade, refresh token, ID token) cifrada com DPAPI na conta do usuário, com arquivo e entropia próprios; access token só em memória; nenhum token na interface, em eventos, preferências, URLs de páginas, erros ou logs; renovação em série com o refresh novo gravado antes do uso; falha de rede não apaga a credencial; desconectar revoga (quando possível) e apaga"
  modulo: "chatgpt.Conta; app.IAService"
  enforced_by: [chatgpt.Conta, chatgpt.EntropiaCredencial, app.VisaoChatGPT]
  falha: "Sessão encerrada → IA-018 (reconectar com o mesmo registro); DPAPI → IA-012"
  testes: ["SEG-SIWC-01"]
  versao: 1

- id: TRV-SEG-015
  origem: "§48.3"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA, UI]
  enunciado: "Conexão da conta só pelo fluxo oficial Sign in with ChatGPT no navegador padrão do sistema: Authorization Code com PKCE S256, state, nonce, retorno só em 127.0.0.1 (um único GET, Host conferido), ID token validado (JWKS, emissor, destinatário, validade, nonce), nome do aplicativo sys-executor; sem a permissão de uso do plano o provedor não gera texto; aviso de privacidade antes da primeira conexão; botão só em texto, sem logotipo nem sugestão de endosso"
  modulo: "chatgpt.Conta; frontend (Configurações de IA)"
  enforced_by: [chatgpt.Conta, chatgpt.EscopoPlano, chatgpt.NomeAplicativo]
  falha: "Negado, cancelado, prazo, conta sem plano elegível → IA-016; sem permissão do plano → IA-017"
  testes: ["SEG-SIWC-02"]
  versao: 1

- id: TRV-SEG-016
  origem: "§48.6"
  fluxo: TRV
  rotulo: [APROVADO]
  tipo: [SEGURANCA, PERGUNTA]
  enunciado: "Na confirmação de envio ao ChatGPT, pergunta obrigatória sobre dados pessoais de criança menor de 13 anos; resposta diferente de não bloqueia o ChatGPT na tarefa, sem envio; a análise só segue com outro serviço escolhido pelo usuário, com nova confirmação"
  modulo: "pipeline (envio_ia)"
  enforced_by: [pipeline.PerguntaEnvioIA, erros.IACriancaChatGPT]
  falha: "IA-021, parada recuperável"
  testes: ["SEG-CRI-01"]
  versao: 1
