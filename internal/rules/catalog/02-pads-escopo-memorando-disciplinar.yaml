# 2. PADS — escopo (Memorando Disciplinar)
# Semeado de docs/planning/MATRIZ_REQUISITOS_V4.md (Fase 3, F3-08).
# O catálogo é a fonte das regras; mudanças seguem REGRAS_IA_ESTRATEGIA.md §5.3.

- id: PADS-ESC-001
  origem: "§§22.1, 30.2"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA, PERGUNTA]
  enunciado: "Memorando Disciplinar inicial é a peça delimitadora; imputações extraídas, apresentadas, confirmadas e congeladas (versão auditável)"
  modulo: "workflow.Delimitar; domain/pads.ImputacaoSet"
  enforced_by: [pads.ImputacaoSet, pads.NovoJulgamento]
  testes: ["PADS-E01", "PADS-E02", "PADS-E03", "PADS-E04", "PADS-E05"]
  versao: 1

- id: PADS-ESC-002
  origem: "§22.1"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [POLITICA_IA, VALIDADOR]
  enunciado: "Nunca criar, ampliar, substituir ou trocar artigo de imputação para cobrir conduta diversa"
  modulo: "schema enum imputacao_id; validate.ScopePADS"
  enforced_by: [pads.Julgamento]
  etapas: [delimitacao, escopo, analise, redacao]
  instrucao_ia: "NUNCA crie, amplie, substitua ou troque o artigo de uma imputação para cobrir conduta diversa da descrita no Memorando Disciplinar."
  testes: ["PADS-E05", "VAL-NEG-01"]
  versao: 1

- id: PADS-ESC-003
  origem: "§22.2"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [DETERMINISTICA, VALIDADOR]
  enunciado: "Resultados admitidos: procedência, procedência parcial, improcedência, sempre por imputação original"
  modulo: "engine.ResultadoGlobal"
  enforced_by: [pads.Julgamento, pads.Global]
  testes: ["PADS-E02", "PADS-E04"]
  versao: 1

- id: PADS-ESC-004
  origem: "§§22.1, 22.3"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [POLITICA_IA, VALIDADOR]
  enunciado: "Conduta diversa descoberta na instrução não gera acusação, punição nem encaminhamento automático na minuta"
  modulo: "I-05; validate.ScopePADS"
  enforced_by: [pads.Julgamento]
  etapas: [escopo, analise, redacao]
  instrucao_ia: "Conduta diversa encontrada na instrução NUNCA vira acusação, punição nem encaminhamento: apenas registre-a no campo próprio, fora da análise das imputações."
  testes: ["PADS-E01", "PADS-E03", "PADS-E05"]
  versao: 1

- id: PADS-ESC-005
  origem: "§22.1"
  fluxo: PADS
  rotulo: [APROVADO]
  tipo: [PERGUNTA]
  enunciado: "Classificação materialmente ambígua de imputação → perguntar, sem inovar"
  modulo: "workflow.Pergunta"
  testes: ["PADS-AMB-01"]
  versao: 1

